<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>In and of place — Actual Neighbors</title>
<meta property="og:title" content="In and of place" />
<meta property="og:description" content="Actual Neighbors" />
<meta property="og:image" content="https://actualneighbors.com/assets/an-in-and-of-place.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Ad landing page for the "In and of place" release (Figma 1154:232).
     One centered column at any width; same rem scale as the main page's
     mobile layout (1rem = 16px at the 393px reference width), so the whole
     card scales with the window and caps at a sane size on desktop. */
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(12px, 4.0712vw, 22px)}
  body{
    background:#0a0a0b;color:#f4f4f5;
    font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:18.875rem;margin:0 auto;padding:3.125rem 0 4.5rem}

  .art{
    display:block;width:18.875rem;height:18.875rem;
    border-radius:1rem;object-fit:cover;
  }

  h1{font-size:2rem;font-weight:700;margin-top:2.1875rem}
  .artist{font-size:1rem;margin-top:.75rem}

  /* same link treatment as the main page: pixel font, shrink-wrapped click
     targets, hover-revealed arrow held with visibility so rows never shift */
  .list{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem}
  .link{
    display:flex;align-items:center;gap:1rem;
    font-family:"DotGothic16","Helvetica Neue",sans-serif;font-size:1.5rem;
    color:#f4f4f5;text-decoration:none;white-space:nowrap;
  }
  .link .arrow{visibility:hidden}
  .link:hover .arrow{visibility:visible}

  /* listen links in two side-by-side columns, filling top-to-bottom */
  .listen{
    margin-top:1.5rem;
    display:grid;grid-auto-flow:column;
    grid-template-rows:repeat(3, auto);
    grid-template-columns:repeat(2, max-content);
    column-gap:2rem;row-gap:.5rem;
  }
  /* the hover arrow can never show on touch — drop its reserved space so
     the two columns fit the mobile card width */
  @media (max-width:600px){
    .link .arrow{display:none}
  }

  hr{border:0;border-top:1px solid rgba(255,255,255,.4);margin-top:6rem}

  .group{margin-top:2.25rem}
  .group h2{
    font-size:1.125rem;font-weight:700;letter-spacing:.0675rem;
    margin-bottom:1rem;
  }
  .group .list{gap:1rem}

  /* ---------- desktop ----------
     Text column on the left, artwork on the right, both vertically
     centered (root scale: 16px at the 1440px reference width). */
  @media (min-width:601px){
    html{font-size:clamp(10px, 1.1111vw, 22px)}
    .wrap{
      width:auto;min-height:100vh;margin:0;padding:3rem 6rem;
      display:flex;flex-direction:row-reverse;
      align-items:center;justify-content:space-between;gap:4rem;
    }
    .col{width:25rem;flex:none}
    .art{width:min(31.25rem, 66vh);height:auto;margin:0 auto}
    h1{margin-top:0}
    .listen{column-gap:3rem}
  }
</style>
</head>
<body>

  <main class="wrap">
    <img class="art" src="assets/an-in-and-of-place.jpg" alt="In and of place — cover art" />

    <div class="col">
    <h1>In and of place</h1>
    <p class="artist">Actual Neighbors</p>

    <div class="list listen">
      <a class="link" href="https://open.spotify.com/album/0W4NLQBGxMBNvqlHVM26aV?si=3soNeK8nQxaiM0BWX_3KYQ" target="_blank" rel="noopener">Spotify<span class="arrow" aria-hidden="true">&rarr;</span></a>
      <a class="link" href="https://music.apple.com/us/album/in-and-of-place/6784346071" target="_blank" rel="noopener">Apple Music<span class="arrow" aria-hidden="true">&rarr;</span></a>
      <a class="link" href="https://tidal.com/album/536813512" target="_blank" rel="noopener">Tidal<span class="arrow" aria-hidden="true">&rarr;</span></a>
      <a class="link" href="https://actualneighbors.bandcamp.com/album/in-and-of-place" target="_blank" rel="noopener">Bandcamp<span class="arrow" aria-hidden="true">&rarr;</span></a>
      <a class="link" href="https://soundcloud.com/actualneighbors/sets/in-and-of-place" target="_blank" rel="noopener">SoundCloud<span class="arrow" aria-hidden="true">&rarr;</span></a>
      <a class="link" href="https://www.qobuz.com/us-en/album/in-and-of-place-actual-neighbors/ejxiwsv85n8fo" target="_blank" rel="noopener">Qobuz<span class="arrow" aria-hidden="true">&rarr;</span></a>
    </div>

    <hr />

    <section class="group">
      <h2>FOLLOW</h2>
      <div class="list">
        <a class="link" href="https://www.instagram.com/actual.neighbors/" target="_blank" rel="noopener">Instagram<span class="arrow" aria-hidden="true">&rarr;</span></a>
      </div>
    </section>

    <section class="group">
      <h2>STUFF</h2>
      <div class="list">
        <a class="link" href="https://shop.actualneighbors.com/" target="_blank" rel="noopener">Merch<span class="arrow" aria-hidden="true">&rarr;</span></a>
      </div>
    </section>
    </div>
  </main>

</body>
</html>

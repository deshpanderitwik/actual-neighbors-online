<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Actual Neighbors</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0a0a0b;color:#f4f4f5;overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed;inset:0;z-index:0}
  #scene canvas{display:block}

  /* ---------- overlay UI (Figma: desktop 1084:6, mobile 1084:51) ----------
     Status line top-left, link nav below it. The status is plain text + dot
     (NOT framed as a pill, so it never reads as interactive). Both layers sit
     above the canvas; the canvas keeps pointer events everywhere else. */
  .status{
    position:fixed;top:72px;left:96px;z-index:2;
    display:flex;align-items:center;gap:16px;
    font-family:"DotGothic16","Helvetica Neue",sans-serif;font-size:28px;
  }
  .dot{width:16px;height:16px;border-radius:50%;flex:none}
  .status[data-state="live"] .dot{
    background:#3ad84d;box-shadow:0 0 12px rgba(58,216,77,.7);
  }
  .status[data-state="scheduled"] .dot{
    background:transparent;border:1.6px solid rgba(255,255,255,.5);
  }

  .links{
    position:fixed;left:96px;top:225px;z-index:2;
    display:flex;flex-direction:column;gap:56px;
  }
  .group{display:flex;flex-direction:column;gap:16px}
  .group h2{
    font-family:Inter,"Helvetica Neue",sans-serif;
    font-size:16px;font-weight:700;letter-spacing:1.08px;
  }
  .list{display:flex;flex-direction:column;gap:16px}
  .link{
    display:flex;align-items:center;gap:16px;
    font-family:"DotGothic16","Helvetica Neue",sans-serif;font-size:28px;
    color:#f4f4f5;text-decoration:none;white-space:nowrap;
  }
  /* hover reveals the arrow; it stays in the layout (visibility, not
     display) so the row never shifts — mirrors the hidden → in the Figma */
  .link .arrow{visibility:hidden}
  .link:hover .arrow{visibility:visible}

  /* ---------- mobile ----------
     Logo sits in the top band (the scene pans, see frame()), the status is
     centered under it, and the links flow below. The page may scroll if a
     short screen can't fit the whole nav. */
  @media (max-width:600px){
    body{overflow:hidden auto}
    .status{
      position:absolute;left:50%;top:31%;transform:translateX(-50%);
      font-size:24px;white-space:nowrap;
    }
    /* these tops are pre-JS fallbacks — placeMobileUI() pins the real ones
       to the logo's projected bottom edge (status 41px under it, links 35px
       under the status) */
    .links{position:absolute;left:50px;top:calc(31% + 90px);gap:48px;padding-bottom:48px}
    .list{gap:8px}
    .link{font-size:24px}
  }

</style>
</head>
<body>

  <div class="status" data-state="scheduled" id="status">
    <span class="dot"></span>
    <span class="label" id="status-label">Checking schedule&hellip;</span>
  </div>

  <nav class="links">
    <section class="group">
      <h2>LISTEN</h2>
      <div class="list">
        <a class="link" href="https://open.spotify.com/artist/756ywnC1hNNFCN6tCs5zSq" target="_blank" rel="noopener">Spotify<span class="arrow" aria-hidden="true">&rarr;</span></a>
        <a class="link" href="https://music.apple.com/us/artist/actual-neighbors/1811532446" target="_blank" rel="noopener">Apple Music<span class="arrow" aria-hidden="true">&rarr;</span></a>
        <a class="link" href="https://tidal.com/artist/57951411" target="_blank" rel="noopener">Tidal<span class="arrow" aria-hidden="true">&rarr;</span></a>
      </div>
    </section>
    <section class="group">
      <h2>FOLLOW</h2>
      <div class="list">
        <a class="link" href="https://www.instagram.com/actual.neighbors/" target="_blank" rel="noopener">Instagram<span class="arrow" aria-hidden="true">&rarr;</span></a>
      </div>
    </section>
    <section class="group">
      <h2>STUFF</h2>
      <div class="list">
        <a class="link" href="https://shop.actualneighbors.com/" target="_blank" rel="noopener">Merch<span class="arrow" aria-hidden="true">&rarr;</span></a>
      </div>
    </section>
  </nav>

  <div id="scene"></div>

  <script src="config.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE        from "three";
  import { SVGLoader }       from "three/addons/loaders/SVGLoader.js";
  import { OrbitControls }   from "three/addons/controls/OrbitControls.js";
  import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

  /* ---------- the logo, inlined so the sketch is self-contained ---------- */
  const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 424">
<path d="M295.428 223.419H40V40H295.428V223.419ZM62.8557 200.582H272.572V62.7942H62.8557V200.582Z"/>
<path d="M528 384H272.572V200.582H528V384ZM295.428 361.206H505.144V223.418H295.428V361.206Z"/>
<path d="M153.594 95.8567H182.901L222.247 167.562H198.323L191.189 154.781H144.837L137.958 167.562H113.18L153.594 95.8567ZM183.542 139.826L168.034 111.237L152.74 139.826H183.584H183.542Z"/>
<path d="M351.008 256.438H385.826L429.358 310.931L428.803 256.438H449.48V328.144H414.363L371.471 274.205L372.027 328.144H351.008V256.438Z"/>
</svg>`;

  /* ---------- tunables ---------- */
  const DEPTH = 34;     // extrusion depth of the logo
  const SPIN  = 0.34;   // auto-rotation speed (radians / second)

  /* ---------- renderer ---------- */
  const mount = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  mount.appendChild(renderer.domElement);

  /* ---------- scene + camera ---------- */
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0b);

  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 6000);
  camera.position.set(0, 150, 900);

  /* ---------- environment (gives the metal something to reflect) ---------- */
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  /* ---------- lights: key + cool rim ---------- */
  const key = new THREE.DirectionalLight(0xffffff, 2.7);
  key.position.set(-280, 360, 480);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x9bb2ff, 2.3);
  rim.position.set(340, -180, -420);
  scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff, 0.12));

  /* ---------- brushed-metal material ----------
     A canvas of faint horizontal streaks drives the roughness map, which is
     what reads as "brushed" rather than mirror-polished. */
  function brushedMap(){
    const c = document.createElement("canvas");
    c.width = c.height = 512;
    const g = c.getContext("2d");
    g.fillStyle = "#cccccc";
    g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 16000; i++){
      const y = Math.random() * 512;
      const x = Math.random() * 512;
      const len = 30 + Math.random() * 280;
      const v = (40 + Math.random() * 150) | 0;
      g.strokeStyle = `rgba(${v},${v},${v},0.05)`;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + len, y);
      g.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(4, 4);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  const metal = new THREE.MeshPhysicalMaterial({
    color: 0xccd0d6,
    metalness: 1.0,
    roughness: 0.6,
    roughnessMap: brushedMap(),
    envMapIntensity: 1.3,
    anisotropy: 0.55,
    side: THREE.DoubleSide,
  });

  /* ---------- hover / touch glitch ----------
     On hover (or touch) the geometry itself erupts. These uniforms feed a
     vertex-shader glitch: vertices within uHoverR of the cursor (uHoverCenter,
     geometry space) are pushed out along their normal by a stuttering, blocky,
     cell-hashed amount — chunks and spikes extruding, with occasional inward
     tears and lateral shear. Lighting is untouched, so it reads as the solid
     mark violently deforming. Uniforms updated each frame in updateGlitch(). */
  metal.onBeforeCompile = (shader) => {
    shader.uniforms.uHoverActive = { value: 0 };
    shader.uniforms.uHoverCenter = { value: new THREE.Vector3() };
    shader.uniforms.uHoverR      = { value: 1 };
    shader.uniforms.uTime        = { value: 0 };
    shader.uniforms.uAmp         = { value: radius * 0.22 };
    shader.uniforms.uCell        = { value: 13.0 };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>',
        `#include <common>
uniform float uHoverActive; uniform vec3 uHoverCenter; uniform float uHoverR;
uniform float uTime; uniform float uAmp; uniform float uCell;
float gh(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }`)
      .replace('#include <begin_vertex>',
        `#include <begin_vertex>
if (uHoverActive > 0.5) {
  float gdist = distance(position, uHoverCenter);
  float fall = 1.0 - clamp(gdist / uHoverR, 0.0, 1.0);
  if (fall > 0.0) {
    float ts = floor(uTime * 16.0);              // stepped time = stutter
    vec3  cell = floor(position / uCell);
    float hc = gh(cell + ts);                    // per-cell, per-step random
    float hv = gh(position * 0.06 + ts * 1.7);   // finer jitter
    float spike = pow(hc, 3.0);                  // few cells spike far
    float push = uAmp * fall * (spike * 4.0 + (hv - 0.5) * 1.4);
    if (hc > 0.93) push -= uAmp * fall * 3.5;    // inward tears
    transformed += normalize(objectNormal) * push;
    transformed.x += (gh(cell * 1.7 + ts) - 0.5) * 2.0 * uAmp * fall * step(0.8, gh(cell + ts * 0.5));
  }
}`);
    metal.userData.shader = shader;
  };

  /* ---------- build the extruded logo ----------
     The two box frames overlap at one corner. Instead of extruding them
     separately (which doubles up geometry there), their 2D union is defined
     directly as a single outline + two holes. Everything is rectangles, so
     no boolean/CSG library is needed — and it extrudes as ONE clean solid
     with no internal seam. The A and N letters extrude into the same
     geometry, so the whole mark is a single mesh. */
  const paths = new SVGLoader().parse(LOGO_SVG).paths;

  function boxUnionShape(){
    const s = new THREE.Shape();
    s.moveTo(40, 40);                  // union outline of the two box rectangles
    s.lineTo(295.428, 40);
    s.lineTo(295.428, 200.582);
    s.lineTo(528, 200.582);
    s.lineTo(528, 384);
    s.lineTo(272.572, 384);
    s.lineTo(272.572, 223.419);
    s.lineTo(40, 223.419);
    s.closePath();

    const aHole = new THREE.Path();    // the A interior
    aHole.moveTo(62.8557, 62.7942);
    aHole.lineTo(272.572, 62.7942);
    aHole.lineTo(272.572, 200.582);
    aHole.lineTo(62.8557, 200.582);
    aHole.closePath();

    const nHole = new THREE.Path();    // the N interior
    nHole.moveTo(295.428, 223.418);
    nHole.lineTo(505.144, 223.418);
    nHole.lineTo(505.144, 361.206);
    nHole.lineTo(295.428, 361.206);
    nHole.closePath();

    s.holes.push(aHole, nHole);
    return s;
  }

  // one shape for the joined frames + one each for the A and N letters
  const shapes = [
    boxUnionShape(),
    ...SVGLoader.createShapes(paths[2]),   // A letter
    ...SVGLoader.createShapes(paths[3]),   // N letter
  ];

  const geom = new THREE.ExtrudeGeometry(shapes, {
    depth: DEPTH, bevelEnabled: true,
    bevelThickness: 3, bevelSize: 2.4, bevelSegments: 4,
  });
  geom.rotateX(Math.PI);   // SVG y-down -> y-up
  geom.center();           // spin around the mark's own middle

  const logo = new THREE.Mesh(geom, metal);
  scene.add(logo);

  geom.computeBoundingSphere();
  const radius = geom.boundingSphere.radius;

  /* ---------- hover / touch tracking ----------
     Updates the cursor in NDC; the raycast happens in the render loop against
     the spinning mesh, so the eruption tracks the live surface. Mouse: hover to
     glitch (pointermove + pointerleave). Touch: there's no hover, so press and
     drag to glitch — pointerdown/move start it, lifting the finger (up/cancel)
     stops it. The raycast hits the original (undeformed) geometry, keeping the
     hit point stable while the spikes bloom around it. */
  const raycaster = new THREE.Raycaster();
  const ndc       = new THREE.Vector2();
  const hitLocal  = new THREE.Vector3();
  let pointerInside = false, hovering = false;
  function setNDC(e){
    const r = renderer.domElement.getBoundingClientRect();
    ndc.x =  ((e.clientX - r.left) / r.width)  * 2 - 1;
    ndc.y = -((e.clientY - r.top)  / r.height) * 2 + 1;
  }
  renderer.domElement.addEventListener("pointerdown",   (e) => { setNDC(e); pointerInside = true; });
  renderer.domElement.addEventListener("pointermove",   (e) => { setNDC(e); pointerInside = true; });
  renderer.domElement.addEventListener("pointerleave",  ()  => { pointerInside = false; });                     // mouse leaves canvas
  renderer.domElement.addEventListener("pointerup",     (e) => { if (e.pointerType !== "mouse") pointerInside = false; });  // finger lifts
  renderer.domElement.addEventListener("pointercancel", ()  => { pointerInside = false; });

  const HOVER_R = radius * 0.34;     // radius of the erupting zone around the cursor

  /* ---------- glitch driver ----------
     Raycast the cursor/touch against the spinning mesh and feed the hit point +
     time into the vertex-shader glitch, so the geometry erupts where you point.
     All the heavy work is on the GPU — this just updates uniforms. */
  function updateGlitch(t){
    hovering = false;
    if (pointerInside){
      raycaster.setFromCamera(ndc, camera);
      const hit = raycaster.intersectObject(logo, false)[0];
      if (hit){ hovering = true; logo.worldToLocal(hitLocal.copy(hit.point)); }
    }
    const sh = metal.userData.shader;
    if (sh){
      sh.uniforms.uHoverActive.value = hovering ? 1 : 0;
      sh.uniforms.uHoverR.value = HOVER_R;
      sh.uniforms.uTime.value = t;
      if (hovering) sh.uniforms.uHoverCenter.value.copy(hitLocal);
    }
  }

  /* ---------- controls: drag to rotate ---------- */
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.enableZoom = false;
  controls.rotateSpeed = 0.9;

  let dragging = false;
  controls.addEventListener("start", () => { dragging = true; });
  controls.addEventListener("end",   () => { dragging = false; });

  /* ---------- keep the logo framed at any window size ----------
     On mobile the design parks the mark in the top band (above the status
     line and links) instead of the center, so the view pans down: the logo's
     screen center moves from 50% to ~17% of the viewport height. A view
     offset keeps OrbitControls and the glitch raycast untouched. */
  function frame(){
    camera.aspect = innerWidth / innerHeight;
    const vFov = THREE.MathUtils.degToRad(camera.fov);
    const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
    if (innerWidth <= 600){
      const dist = (radius * 1.35) / Math.sin(Math.min(vFov, hFov) / 2);
      camera.position.setLength(dist);
      camera.setViewOffset(innerWidth, innerHeight,
        0, innerHeight * 0.33, innerWidth, innerHeight);
    } else {
      // desktop: back the camera off until the mark's projected height
      // matches the link list, then pan right of center and vertically so
      // the mark's top and bottom line up with the list's
      const rect = linksNode.getBoundingClientRect();
      const dist = (bb.max.y - bb.min.y) * innerHeight
                 / (2 * Math.tan(vFov / 2) * rect.height);
      camera.position.setLength(dist);
      camera.setViewOffset(innerWidth, innerHeight,
        -innerWidth * 0.1,
        innerHeight / 2 - (rect.top + rect.height / 2),
        innerWidth, innerHeight);
    }
    camera.updateProjectionMatrix();
    placeMobileUI();
  }

  /* ---------- mobile: hang the status + links off the mark ----------
     The design fixes the vertical rhythm to the logo: status 41px below the
     mark's bottom edge, links 35px below the status. Where that bottom edge
     lands on screen depends on the camera framing, so it's projected here
     (front-facing pose, matching the design's static render) and written as
     inline tops. On desktop the stylesheet positions apply untouched. */
  const statusNode = document.getElementById("status");
  const linksNode  = document.querySelector(".links");
  geom.computeBoundingBox();
  const bb = geom.boundingBox;
  function placeMobileUI(){
    if (innerWidth > 600){
      statusNode.style.top = "";
      linksNode.style.top  = "";
      return;
    }
    camera.updateMatrixWorld();
    const p = new THREE.Vector3(0, bb.min.y, bb.max.z).project(camera);
    const logoBottom = (1 - p.y) / 2 * innerHeight;
    const statusTop  = Math.round(logoBottom) + 41;
    statusNode.style.top = statusTop + "px";
    linksNode.style.top  = (statusTop + statusNode.offsetHeight + 35) + "px";
  }
  function resize(){
    renderer.setSize(innerWidth, innerHeight);
    frame();
  }
  addEventListener("resize", resize);
  resize();
  // the link list height shifts once the web fonts swap in — reframe then
  document.fonts.ready.then(resize);

  /* ---------- render loop ---------- */
  const clock = new THREE.Clock();
  let elapsed = 0;
  (function tick(){
    requestAnimationFrame(tick);
    const dt = clock.getDelta();
    elapsed += dt;
    if (!dragging) logo.rotation.y += SPIN * dt;   // pause auto-spin while dragging
    controls.update();
    updateGlitch(elapsed);
    renderer.render(scene, camera);
  })();

  /* ---------- session status, live from the Google Calendar ----------
     Reads the public "AN Sessions" calendar. The API returns events still
     ending in the future, sorted by start time — so the earliest one is
     either in progress now or the next session. Re-polled every 60s. */
  const statusEl = document.getElementById("status");
  const labelEl  = document.getElementById("status-label");
  const cfg = window.AN_CONFIG || {};

  function setStatus(state, label){
    statusEl.dataset.state = state;
    labelEl.textContent = label;
  }

  function formatSession(d){
    const tz = "America/Los_Angeles";
    const time = d.toLocaleString("en-US",
      { timeZone: tz, hour: "numeric", minute: "2-digit", timeZoneName: "short" });
    const date = d.toLocaleString("en-US",
      { timeZone: tz, weekday: "long", month: "long", day: "numeric" });
    return time + ", " + date;
  }

  async function refreshSession(){
    if (!cfg.apiKey || !cfg.calendarId){
      console.warn("AN_CONFIG missing — set calendarId and apiKey in config.js");
      return;
    }
    const url = "https://www.googleapis.com/calendar/v3/calendars/"
      + encodeURIComponent(cfg.calendarId) + "/events"
      + "?key="     + encodeURIComponent(cfg.apiKey)
      + "&singleEvents=true&orderBy=startTime"
      + "&timeMin=" + new Date().toISOString()
      + "&maxResults=10";
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const sessions = (data.items || [])
        .filter(e => e.summary === "AN Session" && e.start?.dateTime && e.end?.dateTime);

      const next = sessions[0];   // earliest — API already sorts by start time
      if (!next){
        setStatus("scheduled", "No sessions scheduled");
        return;
      }
      const start = new Date(next.start.dateTime).getTime();
      const end   = new Date(next.end.dateTime).getTime();
      const now   = Date.now();
      if (start <= now && now < end){
        setStatus("live", "Session in progress");
      } else {
        setStatus("scheduled", "Next session: " + formatSession(new Date(next.start.dateTime)));
      }
    } catch (err){
      console.warn("Calendar fetch failed:", err.message);
    }
  }

  refreshSession();
  setInterval(refreshSession, 60000);
  </script>
</body>
</html>
